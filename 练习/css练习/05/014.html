<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width:500px;
            height:500px;
            background-color:aqua;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            ;
        }
        .box1{
            width:100px;
            height:100px;
            background-color: red;
            flex-grow: 2;
        }
        .box2{
            width:100px;
            height:100px;
            background-color: rgb(111, 255, 0);
            flex-grow: 2;
        }
        .box3{
            width:100px;
            height:100px;
            background-color: rgb(144, 0, 255);
            flex-grow: 1;}
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
