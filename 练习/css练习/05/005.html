<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color:rgba(255,40,80,0.5);
            font-weight:900;
            font-size:30px;
            font-style:normal;
            font-family:微软雅黑;
        }
        i{
            font-style:normal;
        }

    </style>
</head>
<body>
    <p>我学习字体属性</p><br>
    <span style="font-size:30px;color:rgb(255,40,80,0.5);font-weight:100; font-style:italic">我学习字体属性</span>
    <i>斜体字</i>



</body>
</html>
