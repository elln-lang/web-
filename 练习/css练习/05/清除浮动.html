<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width:500px;
           
            background-color: aqua;
            overflow: hidden;
            clear: both;
        }
        .container::after{
            display: block;
            clear: both;
            content: "";
        }
        .box{
            width: 100px;
            height: 500px;
            float:left;
            background-color: blue;
            margin: 5px ;
        }
        .n{
            clear: both;
            height: 200px;
            width:500px;
            border: 5px solid red;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="n"></div>
    </div>
</body>
</html>
