    <style>
        .tu{
            width: 300px;
            margin: 50px auto;
            animation: donghua 2s linear 1s 2 ;
        }
        .tu:hover{
            animation-play-state: paused;
        }
        @keyframes donghua {
            0%{
                width: 300px;
                border-radius: 0%;

            }
            25%{
                width: 400px;
                border-radius: 25%;

            }
            50%{
                width: 500px;
                border-radius: 50%;

            }
            75%{
                width: 400px;
                border-radius: 25%;

            }
            100%{
                width: 300px;
                border-radius: 0%;
            }
        }
    </style>
</head>
