<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .donghua{
            width: 200px;
            height: 500px;
            background-color: red;
            animation: donghua 3s linear 0s infinite ;
        }
        .donghua:hover{
            animation-play-state: paused;
        }

        @keyframes donghua {
            0%{
                width: 200px;
                background-color: red;
            }
            
            25%{
                width: 350px;
                background-color: blue;
            }

            50%{
                width: 500px;
                background-color: aqua;
            }

            75%{
                width: 350px;
                background-color: blue;
                
            }
            
            100%{
                width: 200px;
                background-color: red;
            }
        }
    </style>
</head>
<body>
    
    <div class="donghua">

    </div>
</body>
</html>
