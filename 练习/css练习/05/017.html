<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width:800px;
            height: 800px;
            background-color: aqua;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items:flex-end;
            flex-wrap: wrap;
        }
        .box1{
            width:100px;
            height: 100px;
            background-color: red;
            padding: 50px;
            border: 10px solid blue;
            margin: 30px;
            font-weight: 700;
            font-style: italic;
            font-family: "微软雅黑";
            color:azure;
            flex:1;
        }
        .box2{
            width: 100px;
            height: 100px;
            background-color: green;
            padding: 50px;
            border: 10px solid blue;
            margin: 30px;
            font-family: "瘦金体";
            font-weight: 300;
            color: blueviolet;
            flex: 1;
        }
        .box3{
            width: 100px;
            height: 100px;
            background-color: yellow;
            color: black;
            padding: 50px;
            border: 10px solid blue;
            margin: 30px;
            font-weight: 400;
            flex:1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">我是盒子1</div>
        <div class="box2">我是盒子2</div>
        <div class="box3">我是盒子3</div>

    </div>
</body>
</html>
