<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .picture{
            width: 200px;
            animation: mydong 5s linear 0.5s infinite;
        }
        .picture:hover{
            animation-play-state: paused;
        }
        @keyframes mydong {
            0%{
                position: relative;
                left: 0;
                top: 0;
                opacity: 0;
                width: 200px;
                border-radius: 0%;
            }
            25%{
                position: relative;
                left: 250px;
                top: 150px;
                opacity: 0.55;
                width: 350px;
                border-radius: 25%;
            }
            50%{
                position: relative;
                left: 500px;
                top: 300px;
                opacity: 1;
                width: 500px;
                border-radius: 50%;

            }
            75%{
                position: relative;
                left: 250px;
                top: 150px;
                opacity: 0.55;
                width: 350px;
                border-radius: 25%;
            }
            100%{
                position: relative;
                left: 0;
                top: 0;
                opacity: 0;
                width: 200px;
                border-radius: 0%;
            }
            
        }
    </style>
</head>
<body>
    
    <div class="container">
        <a href="https://www.4399.cn/"><img src="https://th.bing.com/th/id/R.5760f732476df7ac65768da79d71d59b?rik=cspi%2fwwxmY8xag&riu=http%3a%2f%2fpic.3zitie.cn%2fzhuangshi%2f2023%2f01%2f1302%2fpic%2fimg%2f0116.jpg&ehk=ExebIuSZzaWAXeSYvCPgh4F2ZWbbYTAQuisTfu%2f7xKE%3d&risl=&pid=ImgRaw&r=0" class="picture" alt="这是一个图片"></a>
    </div>
</body>
</html>
